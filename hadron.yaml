streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '':
          - user/themes/hadron
          - user/themes/quark2

theme-mode: auto
accent-color: '#242424'
monochrome-logo: false
favicon:
  user/media/favicon/grav-favicon.svg:
    name: grav-favicon.svg
    type: image/svg+xml
    size: 4868
    path: user/media/favicon/grav-favicon.svg
custom_logo:
  user/media/logo/grav-logo.svg:
    name: grav-logo.svg
    type: image/svg+xml
    size: 4868
    path: user/media/logo/grav-logo.svg
custom_logo_mobile:
  user/media/logo/grav-logo.svg:
    name: grav-logo.svg
    type: image/svg+xml
    size: 4868
    path: user/media/logo/grav-logo.svg
header-fixed: true
header-animated: true
header-transparent: false
sticky-footer: true
hide_title: false
dropdown:
  enabled: true
custommenus:
  enabled: true
menu:
  - text: Grav
    icon: external-link
    url: 'https://getgrav.org/'
    target: _blank
fontawesome:
  enabled: true
  local: false
langswitcher:
  enable: true
  display: inline
  format: icon
blog-page: /blog
h5pembedrootpath: 'https://h5p.org/h5p/embed/'
